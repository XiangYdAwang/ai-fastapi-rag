services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:


#- image：使用 PostgreSQL 16 和 pgvector；
#- container_name：容器名为 ai-rag-postgres；
#- restart：Docker Desktop 重启后自动启动容器；
#- environment：从 .env 读取用户名、密码和数据库名；
#- ports：Windows 的 5432 转发到容器的 5432；
#- postgres_data：数据卷，容器删除后数据库数据仍然保留；
#- initdb：容器第一次初始化时执行我们创建的 SQL；
#- healthcheck：检查 PostgreSQL 是否真正可以接受连接。